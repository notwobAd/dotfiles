[include]
autoload = false
files = ["theme.toml"]

[backdrop]
blur_intensity = 0.0
enabled = true
tint_intensity = 0.0

[bar.default]
background_opacity = 0.92999997921288013
capsule = true
center = [ "media" ]
end = [ "sysmon", "tray", "notifications", "network", "bluetooth", "volume", "wallpaper", "clock", "control-center" ]
font_family = "Adwaita Sans"
font_weight = 400
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
start = [ "active_window", "workspaces" ]

[hooks]
wallpaper_changed = "waypaper --wallpaper $NOCTALIA_WALLPAPER_PATH --backend awww"

[location]
auto_locate = true

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
position = "top_right"

    [osd.kinds]
    keyboard_layout = false
    media = false

[shell]
avatar_path = "/home/not2bad/.frostnova.face.png"
niri_overview_type_to_launch_enabled = true

[theme]
community_palette = "Oxocarbon"
custom_palette = "g1wucdpbqai2yvu-ts"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/not2bad/.local/share/Wallpapers"
enabled = false

[widget.active_window]
title_scroll = "on_hover"

[widget.clock]
format = "{:%H:%M %a, %b %d}"

[widget.media]
title_scroll = "on_hover"

[widget.network]
show_label = false

    [widget.network.actions]
    right = "panel-toggle control-center network"

[widget.volume]
show_label = false
